# Local services for the Bluesky moderation pipeline.
# Credentials come from the project root .env (see .env.example).
# Airflow runs separately under airflow/ with the Astro CLI.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bluesky}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Metabase keeps its own settings, questions, and dashboards in an H2 file on the
  # metabase-data volume, so they survive container rebuilds. It reads the pipeline's
  # data from the postgres service (host "postgres", port 5432), set up once in the UI.
  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - postgres

volumes:
  pgdata:
  metabase-data:
