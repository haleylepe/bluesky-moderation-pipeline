bluesky_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5433') | int }}"
      user: "{{ env_var('DB_USER', 'haley') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: bluesky
      schema: analytics
      threads: 4
